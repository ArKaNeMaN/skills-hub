# Local one-command start:
#   docker compose up --build
#
# Defaults are for plain HTTP on the local network. If the service is
# exposed outside it, terminate TLS on a reverse proxy and set:
#   PUBLIC_URL=https://hub.example.com
#   TRUST_PROXY=true
#   REQUIRE_TLS=true
#
# SKILLS_HUB_ADMIN_TOKEN is required: set it in .env before starting.
# The same value logs in to the web UI.
#
# To run a published image instead of building locally, set SKILLS_HUB_IMAGE
# and start without a build:
#   SKILLS_HUB_IMAGE=registry.example.com/example/skills-hub-server:0.0.0 \
#     docker compose pull && docker compose up --no-build

services:
  skills-hub:
    image: ${SKILLS_HUB_IMAGE:-skills-hub-server:local}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${SKILLS_HUB_PORT:-8788}:8788"
    environment:
      SKILLS_HUB_ADMIN_TOKEN: "${SKILLS_HUB_ADMIN_TOKEN:?set SKILLS_HUB_ADMIN_TOKEN in .env}"
      PUBLIC_URL: "${PUBLIC_URL:-}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      REQUIRE_TLS: "${REQUIRE_TLS:-false}"
    volumes:
      - skills-hub-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8788/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  skills-hub-data:
